<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>living brain</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="creature" aria-label="your notes, drawn as a living creature"></canvas>

<header class="brand">
  <h1>living brain</h1>
  <p>obsidian's graph view, except the graph is alive</p>
</header>

<nav class="top">
  <button id="toggle-panel" aria-expanded="true" aria-controls="panel">notes</button>
  <button id="export" title="download your notes as json">export</button>
  <button id="reset" title="start over with waystone's seed">reset</button>
</nav>

<aside id="panel" class="panel">
  <section id="detail" class="detail" hidden></section>
  <div class="panel-head">
    <input id="filter" type="search" placeholder="filter notes" aria-label="filter notes">
    <span id="count" class="count"></span>
  </div>
  <ul id="notes" class="notes"></ul>
</aside>

<div id="bubble" class="bubble" role="status" aria-live="polite">
  <span id="says"></span>
  <small id="mood"></small>
</div>

<main class="dock">
  <div id="card" class="card" hidden></div>
  <form id="entry" class="entry" autocomplete="off">
    <button type="button" id="mic" class="mic" aria-pressed="false" title="talk to it">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      <span class="sr">voice</span>
    </button>
    <input id="text" name="text" placeholder="tell it anything" aria-label="new note">
    <button type="submit" class="feed">feed</button>
  </form>
  <p id="hint" class="hint"></p>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
